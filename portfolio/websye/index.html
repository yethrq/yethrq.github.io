<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Yethrq</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="login-container">
      <h1>Login ke webs Yethrq</h1>
      <form action="home.html" method="GET" onsubmit="return validateLogin();">
        <input type="text" id="username" placeholder="kasi masuk Username" />
        <input
          type="password"
          id="password"
          placeholder="kasi masuk Password"
        />
        <button type="submit">masuk</button>
      </form>
    </div>

    <script src="js/javascript.js"></script>
  </body>
</html>
